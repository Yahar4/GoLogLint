name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  GO_VERSION: '1.26.1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.1']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run tests
      run: go test -v -race ./...

    - name: Run lint on itself
      run: |
        go run cmd/gologlint/main.go ./...

  build-standalone:
    name: Build Standalone
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build
      run: go build -o gologlint cmd/gologlint/main.go

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: gologlint
        path: gologlint
        retention-days: 5

  build-plugin:
    name: Build Plugin
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Build plugin
      run: CGO_ENABLED=1 go build -buildmode=plugin -o gologlint.so plugin/gologlint.go

    - name: Upload plugin
      uses: actions/upload-artifact@v4
      with:
        name: gologlint-plugin
        path: gologlint.so
        retention-days: 5

  build-cross:
    name: Cross-platform Build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        OUTPUT="gologlint-${{ matrix.goos }}-${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT="$OUTPUT.exe"
        fi
        go build -o "$OUTPUT" cmd/gologlint/main.go

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gologlint-${{ matrix.goos }}-${{ matrix.goarch }}
        path: gologlint-*
        retention-days: 5

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-standalone, build-plugin, build-cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        cp -r artifacts/*/* release/
        cd release
        ls -la

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
